<div class="social-wrap">
  <ul class="social-media-list">
    <li><a target="_blank" href="https://youtube.com/{{ site.youtube_username }}" >{%- include svgs/youtube.svg -%}</a></li>
    <li><a target="_blank" href="https://instagram.com/{{ site.instagram_username }}" >{%- include svgs/instagram.svg -%}</a></li>
  </ul>
  <ul class="social-media-list contact-icons-list">
    <li><a target="_blank" class="mailphone" href="mailto:{{ site.email_id }}" >{%- include svgs/mail.svg -%}</a></li>
    <li><a target="_blank" class="mailphone" href="tel:{{ site.phone_number }}" >{%- include svgs/phone.svg -%}</a></li>
    <li><a target="_blank" href="https://wa.me/{{ site.whatsapp_number }}" >{%- include svgs/whatsapp.svg -%}</a></li>
    <li><a target="_blank" class="telegram" href="https://t.me/{{ site.telegram_username }}" >{%- include svgs/telegram.svg -%}</a></li>

    <li><a target="_blank" class="twitter" href="https://x.com/{{ site.twitter_username }}" >{%- include svgs/x.svg -%}</a></li>
    <li><a target="_blank" class="telegram" href="https://t.me/{{ site.telegram_channel_id }}" >{%- include svgs/telegram.svg -%}</a></li> -->
